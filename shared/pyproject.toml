[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-shared"
version = "0.1.0"
description = "Shared domain models, provider interfaces, and infrastructure for the RAG platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "structlog>=24.0,<25.0",
    "opentelemetry-sdk>=1.24,<2.0",
    "opentelemetry-exporter-otlp>=1.24,<2.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "faiss-cpu>=1.8,<2.0",
    "sentence-transformers>=3.0,<4.0",
    "openai>=1.0,<2.0",
    "anthropic>=0.25,<1.0",
    "redis[hiredis]>=5.0,<6.0",
    "celery[redis]>=5.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
