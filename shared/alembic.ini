# Alembic configuration — managed by shared/alembic/env.py
# DATABASE_URL is injected at runtime via the environment; the sqlalchemy.url
# line below is intentionally left blank so env.py always takes precedence.

[alembic]
script_location = alembic
prepend_sys_path = .

# Alembic resolves the URL in env.py; keep this blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
