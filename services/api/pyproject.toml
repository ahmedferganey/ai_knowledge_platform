[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-knowledge-api"
version = "0.1.0"
description = "FastAPI service for the AI Knowledge Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.4,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
