[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-knowledge-api"
version = "0.1.0"
description = "FastAPI service for the AI Knowledge Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
    # Auth
    "python-jose[cryptography]>=3.3",
    # Rate limiting
    "slowapi>=0.1.9",
    # Async DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Redis
    "redis[hiredis]>=5.0",
    # Celery client (enqueue only — no worker here)
    "celery[redis]>=5.3",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "structlog>=24.1",
    # Shared domain library
    "ai-knowledge-shared @ file:///${PROJECT_ROOT}/shared",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/core", "src/services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
