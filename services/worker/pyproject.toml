[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-knowledge-worker"
version = "0.1.0"
description = "Celery ingestion worker for the AI Knowledge Platform"
requires-python = ">=3.11"
dependencies = [
    # Async task queue
    "celery[redis]>=5.3",
    # Shared domain library
    "ai-knowledge-shared @ file:///${PROJECT_ROOT}/shared",
    # Document parsing
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pandas>=2.0",
    # Embedding
    "sentence-transformers>=2.7",
    # Config
    "pydantic-settings>=2.2",
    # Structured logging
    "structlog>=24.1",
    # OpenTelemetry
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-celery>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
